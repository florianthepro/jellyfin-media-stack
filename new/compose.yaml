name: jellyfin-media-stack

services:

  portainer:
    image: portainer/portainer-ce:lts
    container_name: portainer
    volumes: ["/var/run/docker.sock:/var/run/docker.sock", "./data/portainer:/data"]
    restart: always

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-jfms
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARE_API_KEY}"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: always

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    environment: {TZ: "${TZ}"}
    volumes: ["./data/jellyfin/config:/config", "./data/jellyfin/cache:/cache", "${MEDIA}:/media"]
    restart: unless-stopped

  tdarr:
    image: ghcr.io/haveagitgat/tdarr:latest
    container_name: tdarr
    environment: {TZ: "${TZ}", PUID: "${PUID}", PGID: "${PGID}", serverIP: "0.0.0.0", serverPort: "8266", webUIPort: "8265", internalNode: "true", inContainer: "true", auth: "true", apiKey: "${TDARR_API_KEY}"}
    volumes: ["./data/tdarr/server:/app/server", "./data/tdarr/configs:/app/configs", "./data/tdarr/logs:/app/logs", "./data/tdarr/temp:/temp", "${MEDIA}:/media"]
    restart: unless-stopped

  iptv-epg:
    image: ghcr.io/iptv-org/epg:master
    container_name: iptv-epg
    environment: {TZ: "${TZ}", CRON_SCHEDULE: "30 2 * * *", DAYS: "7", RUN_AT_STARTUP: "true"}
    volumes: ["./data/iptv-epg/public:/epg/public", "${MEDIA}/jellyfin/livetv/channels.xml:/epg/channels.xml:ro"]
    restart: unless-stopped

  iptv-epg-arte:
    image: ghcr.io/iptv-org/epg:master
    container_name: iptv-epg-arte
    environment: {TZ: "${TZ}", CRON_SCHEDULE: "30 3 * * *", DAYS: "7", RUN_AT_STARTUP: "true"}
    volumes: ["./data/iptv-epg-arte/public:/epg/public", "${MEDIA}/jellyfin/livetv/channels-arte.xml:/epg/channels.xml:ro"]

    restart: unless-stopped
