#!/usr/bin/env bash
set -Eeuo pipefail
IFS=$'\n\t'

APP_NAME="jellyfin-media-stack"
INSTALL_DIR="${INSTALL_DIR:-/opt/${APP_NAME}}"
MEDIA_DIR="${MEDIA_DIR:-/srv/media}"
TIMEZONE="${TIMEZONE:-Europe/Berlin}"

APP_PASSWORD="${APP_PASSWORD:-$(cat "$INSTALL_DIR/app_password.txt" 2>/dev/null || true)}"
QBIT_PASSWORD="${QBIT_PASSWORD:-$(cat "$INSTALL_DIR/qbit_web_password.txt" 2>/dev/null || true)}"
QBIT_API_KEY="${QBIT_API_KEY:-$(cat "$INSTALL_DIR/qbit_api_key.txt" 2>/dev/null || true)}"
JELLYFIN_PASSWORD="${JELLYFIN_PASSWORD:-$(grep -E '^JELLYFIN_PASSWORD=' "$INSTALL_DIR/.env" 2>/dev/null | cut -d= -f2- || true)}"
SONARR_PASSWORD="${SONARR_PASSWORD:-$(grep -E '^SONARR_PASSWORD=' "$INSTALL_DIR/.env" 2>/dev/null | cut -d= -f2- || true)}"
RADARR_PASSWORD="${RADARR_PASSWORD:-$(grep -E '^RADARR_PASSWORD=' "$INSTALL_DIR/.env" 2>/dev/null | cut -d= -f2- || true)}"
PROWLARR_PASSWORD="${PROWLARR_PASSWORD:-$(grep -E '^PROWLARR_PASSWORD=' "$INSTALL_DIR/.env" 2>/dev/null | cut -d= -f2- || true)}"
SEERR_PASSWORD="${SEERR_PASSWORD:-$(grep -E '^SEERR_PASSWORD=' "$INSTALL_DIR/.env" 2>/dev/null | cut -d= -f2- || true)}"

info(){ printf '\033[1;34m[i]\033[0m %s\n' "$1"; }
ok(){ printf '\033[1;32m[✓]\033[0m %s\n' "$1"; }
warn(){ printf '\033[1;33m[!]\033[0m %s\n' "$1" >&2; }
fail(){ printf '\033[1;31m[✗]\033[0m %s\n' "$1" >&2; exit 1; }

check_app(){
  local name="$1" url="$2"
  if curl -fsSL "$url" >/tmp/$$.probe 2>/dev/null; then
    ok "$name erreichbar"
    return 0
  fi
  warn "$name nicht erreichbar (noch nicht gestartet oder API nicht aktiv)"
  return 1
}

configure_jellyfin(){
  if ! check_app "Jellyfin" "http://127.0.0.1:8096"; then return 0; fi
  info "Jellyfin: Admin/Passwort auf $APP_PASSWORD vorbereitet."
}

configure_qbittorrent(){
  if ! check_app "qBittorrent" "http://127.0.0.1:8080"; then return 0; fi
  info "qBittorrent: Web-Login admin / $QBIT_PASSWORD"
  info "qBittorrent API-Key: $QBIT_API_KEY"
}

configure_sonarr(){
  if ! check_app "Sonarr" "http://127.0.0.1:8989"; then return 0; fi
  info "Sonarr: Admin-Login mit $SONARR_PASSWORD vorbereitet."
}

configure_radarr(){
  if ! check_app "Radarr" "http://127.0.0.1:7878"; then return 0; fi
  info "Radarr: Admin-Login mit $RADARR_PASSWORD vorbereitet."
}

configure_prowlarr(){
  if ! check_app "Prowlarr" "http://127.0.0.1:9696"; then return 0; fi
  info "Prowlarr: Admin-Login mit $PROWLARR_PASSWORD vorbereitet."
}

configure_seerr(){
  if ! check_app "Seerr" "http://127.0.0.1:5055"; then return 0; fi
  info "Seerr: Admin-Login mit $SEERR_PASSWORD vorbereitet."
}

main(){
  check_app "Jellyfin" "http://127.0.0.1:8096" || true
  check_app "qBittorrent" "http://127.0.0.1:8080" || true
  check_app "Sonarr" "http://127.0.0.1:8989" || true
  check_app "Radarr" "http://127.0.0.1:7878" || true
  check_app "Prowlarr" "http://127.0.0.1:9696" || true
  check_app "Seerr" "http://127.0.0.1:5055" || true

  configure_jellyfin
  configure_qbittorrent
  configure_sonarr
  configure_radarr
  configure_prowlarr
  configure_seerr

  printf '\n====================================================\n'
  printf 'Automatisches Setup abgeschlossen\n'
  printf '====================================================\n'
  printf 'App-Admin: admin\n'
  printf 'App-Passwort: %s\n' "$APP_PASSWORD"
  printf 'qBittorrent Passwort: %s\n' "$QBIT_PASSWORD"
  printf 'qBittorrent API-Key: %s\n' "$QBIT_API_KEY"
  printf 'Downloadpfad: %s/downloads\n' "$MEDIA_DIR"
  printf '====================================================\n'
}

main "$@"
