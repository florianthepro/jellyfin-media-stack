#!/usr/bin/env bash
set -Eeuo pipefail
IFS=$'\n\t'

INSTALL_DIR="${INSTALL_DIR:-/opt/jellyfin-media-stack}"
MEDIA_DIR="${MEDIA_DIR:-/srv/media}"
APP_PASSWORD="${APP_PASSWORD:-$(cat "$INSTALL_DIR/app_password.txt" 2>/dev/null || true)}"
QBIT_PASSWORD="${QBIT_PASSWORD:-$(cat "$INSTALL_DIR/qbit_web_password.txt" 2>/dev/null || true)}"
QBIT_API_KEY="${QBIT_API_KEY:-$(cat "$INSTALL_DIR/qbit_api_key.txt" 2>/dev/null || true)}"
QBIT_PORT="${QBIT_PORT:-8080}"
QBIT_TORRENT_PORT="${QBIT_TORRENT_PORT:-6881}"

info(){ printf '\033[1;34m[i]\033[0m %s\n' "$1"; }
ok(){ printf '\033[1;32m[✓]\033[0m %s\n' "$1"; }
warn(){ printf '\033[1;33m[!]\033[0m %s\n' "$1" >&2; }
fail(){ printf '\033[1;31m[✗]\033[0m %s\n' "$1" >&2; exit 1; }

check_http(){
  local url="$1"
  curl -fsSL "$url" >/dev/null 2>&1
}

wait_for_service(){
  local name="$1" url="$2"
  for _ in $(seq 1 60); do
    if check_http "$url"; then
      ok "$name erreichbar"
      return 0
    fi
    sleep 2
  done
  warn "$name nicht erreichbar - manuelle Einrichtung bleibt erforderlich"
  return 1
}

auto_qbittorrent(){
  local qbit_url="http://127.0.0.1:${QBIT_PORT}"
  if ! wait_for_service "qBittorrent" "$qbit_url"; then
    return 0
  fi

  if [[ -n "$QBIT_PASSWORD" ]]; then
    local version
    version=$(curl -fsSL -u "admin:$QBIT_PASSWORD" "$qbit_url/api/v2/app/version" 2>/dev/null || true)
    if [[ -n "$version" ]]; then
      ok "qBittorrent API erreichbar"
      info "qBittorrent API-Key: $QBIT_API_KEY"
      info "Login: admin / $QBIT_PASSWORD"
    else
      warn "qBittorrent Auth nicht erreichbar; manuelles Setup bleibt erforderlich."
    fi
  fi
}

auto_jellyfin(){
  local base="http://127.0.0.1:8096"
  if wait_for_service "Jellyfin" "$base"; then
    info "Jellyfin Admin: admin"
    info "Jellyfin Passwort: $APP_PASSWORD"
  fi
}

auto_sonarr(){
  local base="http://127.0.0.1:8989"
  if wait_for_service "Sonarr" "$base"; then
    info "Sonarr ist bereit; Root-Folder: /tv"
  fi
}

auto_radarr(){
  local base="http://127.0.0.1:7878"
  if wait_for_service "Radarr" "$base"; then
    info "Radarr ist bereit; Root-Folder: /movies"
  fi
}

auto_prowlarr(){
  local base="http://127.0.0.1:9696"
  if wait_for_service "Prowlarr" "$base"; then
    info "Prowlarr ist bereit; Indexer konfigurieren"
  fi
}

auto_seerr(){
  local base="http://127.0.0.1:5055"
  if wait_for_service "Seerr" "$base"; then
    info "Seerr ist bereit; Admin-Anbindung konfigurieren"
  fi
}

print_final(){
  printf '\n====================================================\n'
  printf 'Automatisches Setup\n'
  printf '====================================================\n'
  printf 'Admin Passwort: %s\n' "$APP_PASSWORD"
  printf 'qBittorrent Passwort: %s\n' "$QBIT_PASSWORD"
  printf 'qBittorrent API-Key: %s\n' "$QBIT_API_KEY"
  printf 'Downloadpfad: %s/downloads\n' "$MEDIA_DIR"
  printf '====================================================\n'
}

main(){
  auto_jellyfin
  auto_qbittorrent
  auto_sonarr
  auto_radarr
  auto_prowlarr
  auto_seerr
  print_final

  printf '\nWenn eine API nicht erreichbar ist, bleibst du im manuellen Browser-Setup.\n'
}

main "$@"
